# Render Blueprint Specification for Annadaan Platform
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ========================================================
  # 1. Backend REST API Web Service
  # ========================================================
  - type: web
    name: annadaan-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Optional: Connect MongoDB Atlas URI in Render dashboard
      # If omitted, Annadaan's built-in resilient in-memory store activates automatically
      - key: MONGO_URI
        sync: false

  # ========================================================
  # 2. Frontend React 18 + Vite Static Site (Free Global CDN)
  # ========================================================
  - type: static
    name: annadaan-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single-Page Application (SPA) rewrite to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
